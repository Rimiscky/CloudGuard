openapi: 3.1.2
info:
  title: Service disponibilites
  version: 1.0.0
  description: >
    Créneaux occupés et créneaux libres des salles, de 8 h à 20 h,
    tous les jours. Les heures sont locales à l'espace, sans fuseau.
    /occupations n'est appelé que par le service reservations.
servers:
  - url: http://localhost:8000
    description: Depuis le poste (port publié par Docker Compose)
  - url: http://disponibilites:8000
    description: Depuis le réseau Docker Compose (autres services)
# Aucune authentification : le service est appele directement
security: []
paths:
  /disponibilites/{salle_id}:
    get:
      operationId: lireDisponibilites
      summary: Occupations et créneaux libres d'une salle pour un jour
      parameters:
        - name: salle_id
          in: path
          required: true
          schema:
            type: string
          example: LYO-01
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
          example: "2026-11-16"
      responses:
        "200":
          description: Le planning du jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Planning"
        "422":
          description: Paramètre manquant ou date invalide (FastAPI)
  /occupations:
    post:
      operationId: occuperCreneau
      summary: Bloquer un créneau pour une réservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Occupation"
      responses:
        "201":
          description: Créneau bloqué
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Occupation"
        "409":
          description: Le créneau chevauche une occupation existante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "422":
          description: >
            Créneau hors des heures d'ouverture, sur deux jours,
            ou corps invalide
  /occupations/{reservation_id}:
    delete:
      operationId: libererCreneau
      summary: Libérer le créneau d'une réservation
      parameters:
        - name: reservation_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Créneau libéré
        "404":
          description: Aucune occupation pour cette réservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
components:
  schemas:
    Creneau:
      type: object
      required: [debut, fin]
      properties:
        debut:
          type: string
          pattern: "^[0-2][0-9]:[0-5][0-9]$"
          example: "11:00"
        fin:
          type: string
          pattern: "^[0-2][0-9]:[0-5][0-9]$"
          example: "16:00"
    Planning:
      type: object
      required: [salle_id, date, occupations, creneaux_libres]
      properties:
        salle_id:
          type: string
          example: LYO-01
        date:
          type: string
          format: date
          example: "2026-11-16"
        occupations:
          type: array
          items:
            $ref: "#/components/schemas/Creneau"
        creneaux_libres:
          type: array
          items:
            $ref: "#/components/schemas/Creneau"
    Occupation:
      type: object
      required: [reservation_id, salle_id, debut, fin]
      properties:
        reservation_id:
          type: string
          example: b23d113d-f024-4b76-ad32-21a3731ca480
        salle_id:
          type: string
          example: LYO-01
        debut:
          type: string
          description: Date et heure locales, sans fuseau
          example: "2026-11-16T14:00:00"
        fin:
          type: string
          description: Date et heure locales, sans fuseau
          example: "2026-11-16T16:00:00"
    Erreur:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          example: Créneau déjà occupé
