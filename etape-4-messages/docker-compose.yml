# Reservation de salles dans un reseau d'espaces de travail partages.
# Seule la passerelle est publiee sur le poste : http://localhost:8080
# (plus l'interface d'administration de RabbitMQ, pour observer les files).
# Les services ne sont joignables que sur le reseau de Docker Compose.
# Mots de passe de demonstration, a ne jamais reprendre tels quels.

services:

  # --- Entree unique -------------------------------------------------------
  passerelle:
    build: ./passerelle
    ports:
      - "127.0.0.1:${PORT_PASSERELLE:-8080}:8080"
    volumes:
      - ./cles/public.pem:/cles/public.pem:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      start_period: 120s

  redis:  # compteurs de la limitation de debit
    image: redis:8.10.2-alpine3.23
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # --- Service catalogue (Node, Express) et sa base ------------------------
  catalogue:
    build: ./catalogue
    environment:
      DATABASE_URL: postgres://catalogue:catalogue-mdp@catalogue-db/catalogue
      COUPE_CIRCUIT: ${COUPE_CIRCUIT:-1}
    depends_on:
      catalogue-db:
        condition: service_healthy
    restart: on-failure  # relance si le processus s'arrete sur une erreur
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s

  catalogue-db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: catalogue
      POSTGRES_USER: catalogue
      POSTGRES_PASSWORD: catalogue-mdp
    volumes:
      - catalogue-db:/var/lib/postgresql
      # scripts executes au premier demarrage, quand le volume est vide
      - ./catalogue/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h localhost : pret seulement quand le vrai serveur ecoute en TCP
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "catalogue"]
      interval: 5s
      # l'initialisation de la base peut depasser 3 essais (15 s) sur un
      # poste charge : les echecs de cette periode ne comptent pas
      start_period: 30s
      start_interval: 1s

  # --- Service disponibilites (Python, FastAPI) et son fichier SQLite ------
  disponibilites:
    build: ./disponibilites
    environment:
      # pannes simulees (voir app/main.py), aucune par defaut
      LATENCE_S: ${LATENCE_S:-0}
      PANNE_HTTP: ${PANNE_HTTP:-0}
      PANNE_NB: ${PANNE_NB:-0}
    volumes:
      - disponibilites-donnees:/donnees
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request as r;r.urlopen('http://localhost:8000/health')
      interval: 5s

  # --- Service reservations (Java, Spring Boot) et sa base -----------------
  reservations:
    build: ./reservations
    environment:
      SPRING_DATASOURCE_PASSWORD: reservations-mdp
      SPRING_RABBITMQ_USERNAME: coworking
      SPRING_RABBITMQ_PASSWORD: rabbitmq-mdp
    depends_on:
      reservations-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      # une JVM peut mettre plus d'une minute a demarrer sur un poste
      # modeste ; un controle reussi met fin a cette periode
      start_period: 120s

  reservations-db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: reservations
      POSTGRES_USER: reservations
      POSTGRES_PASSWORD: reservations-mdp
    volumes:
      - reservations-db:/var/lib/postgresql
      - ./reservations/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "reservations"]
      interval: 5s
      start_period: 30s
      start_interval: 1s

  # --- Messagerie asynchrone ----------------------------------------------
  rabbitmq:
    image: rabbitmq:4.4.0-management-alpine
    hostname: rabbitmq  # nom de noeud fixe : les donnees survivent
    environment:
      RABBITMQ_DEFAULT_USER: coworking
      RABBITMQ_DEFAULT_PASS: rabbitmq-mdp
    ports:
      - "127.0.0.1:${PORT_RABBITMQ_UI:-15672}:15672"
    volumes:
      - rabbitmq-donnees:/var/lib/rabbitmq
    healthcheck:
      # Le port AMQP accepte-t-il une connexion ? rabbitmq-diagnostics
      # ping repond avant son ouverture ; check_port_connectivity lance
      # une machine Erlang a chaque controle (pres d'un coeur en continu)
      # et, lance des la premiere seconde, cree le cookie Erlang au nom de
      # root : RabbitMQ ne demarre plus.
      test: ["CMD", "nc", "-z", "localhost", "5672"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      start_interval: 1s

  notifications:
    build: ./notifications
    environment:
      RABBITMQ_URL: amqp://coworking:rabbitmq-mdp@rabbitmq:5672/%2F
      # panne simulee (voir notifications.py), aucune par defaut
      PAUSE_AVANT_ACK: ${PAUSE_AVANT_ACK:-0}
    volumes:
      # reservations deja confirmees (consommateur idempotent)
      - notifications-donnees:/donnees
    depends_on:
      rabbitmq:
        condition: service_healthy
    # sans reconnexion automatique, le consommateur s'arrete quand
    # RabbitMQ s'arrete : Docker le relance
    restart: on-failure

volumes:
  catalogue-db:
  disponibilites-donnees:
  reservations-db:
  rabbitmq-donnees:
  notifications-donnees:
