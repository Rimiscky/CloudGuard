# Le mot de passe arrive par variable d'environnement
# (SPRING_DATASOURCE_PASSWORD).
spring:
  application:
    name: reservations
  datasource:
    url: jdbc:postgresql://reservations-db:5432/reservations
    username: reservations
  http:
    clients:
      # Sans ces deux reglages, le client HTTP du JDK attend sans limite
      connect-timeout: 1s
      read-timeout: 2s
  jackson:
    # salleId en Java, salle_id dans le JSON
    property-naming-strategy: SNAKE_CASE
  mvc:
    problemdetails:
      # erreurs au format de la RFC 9457 (champ "detail")
      enabled: true

# Etat des coupe-circuits, lisible depuis le reseau Docker :
# /actuator/circuitbreakers et /actuator/circuitbreakerevents
management:
  endpoints:
    web:
      exposure:
        include: health, circuitbreakers, circuitbreakerevents

# Nouvelles tentatives et coupe-circuit, un reglage par service appele
resilience4j:
  retry:
    instances:
      catalogue:
        max-attempts: 3            # 1 appel + 2 nouvelles tentatives
        wait-duration: 500ms       # 500 ms, puis 1 s (attente doublee)
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:          # pannes passageres seulement
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
      disponibilites:
        max-attempts: 3            # POST /occupations idempotent
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10          # les 10 derniers appels
        minimum-number-of-calls: 5       # pas de verdict avant 5 appels
        failure-rate-threshold: 50       # ouvert a 50 % d'echecs
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:               # le reste compte comme succes
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
    instances:
      catalogue:
        base-config: default
      disponibilites:
        base-config: default

# Adresses des autres services sur le reseau de Docker Compose
services:
  catalogue: http://catalogue:3000
  disponibilites: http://disponibilites:8000
