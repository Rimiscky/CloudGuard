openapi: 3.1.2
info:
  title: Service catalogue
  version: 1.1.0
  description: >
    Espaces, salles et équipements du réseau. Lecture seule.
    Depuis l'extérieur, on l'appelle à travers la passerelle
    (préfixe /api, jeton JWT exigé) ; sur le réseau Docker Compose,
    les autres services l'appellent directement.
servers:
  - url: http://catalogue:3000
    description: Accès direct, depuis le réseau Docker Compose
  - url: http://localhost:8080/api
    description: À travers la passerelle (jeton exigé)
security:
  - jeton: []
paths:
  /espaces:
    get:
      operationId: listerEspaces
      summary: Lister les espaces du réseau
      responses:
        "200":
          description: Les espaces, triés par identifiant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Espace"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "429":
          $ref: "#/components/responses/TropDeRequetes"
  /equipements:
    get:
      operationId: listerEquipements
      summary: Lister les équipements possibles d'une salle
      responses:
        "200":
          description: Les équipements, triés par code
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Equipement"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "429":
          $ref: "#/components/responses/TropDeRequetes"
  /salles:
    get:
      operationId: chercherSalles
      summary: Chercher des salles (filtres facultatifs, cumulables)
      parameters:
        - name: ville
          in: query
          schema:
            type: string
          example: Lyon
        - name: capacite_min
          in: query
          description: Nombre de places minimal
          schema:
            type: integer
            minimum: 0
          example: 6
        - name: equipement
          in: query
          description: Code d'un équipement que la salle doit avoir
          schema:
            type: string
          example: visio
        - name: date
          in: query
          description: >
            Jour du créneau recherché ; date, debut et fin vont ensemble.
            Avec eux, chaque salle porte le champ libre, lu dans le
            service disponibilites.
          schema:
            type: string
            format: date
          example: "2026-11-16"
        - name: debut
          in: query
          description: Heure de début du créneau (HH:MM)
          schema:
            type: string
            pattern: "^[0-2][0-9]:[0-5][0-9]$"
          example: "14:00"
        - name: fin
          in: query
          description: Heure de fin du créneau (HH:MM)
          schema:
            type: string
            pattern: "^[0-2][0-9]:[0-5][0-9]$"
          example: "16:00"
      responses:
        "200":
          description: >
            Les salles qui passent tous les filtres. Si les disponibilités
            d'au moins une salle n'ont pas pu être lues, la réponse reste
            200 (réponse partielle) : ces salles ont libre à null et
            l'en-tête X-Disponibilites vaut inconnues.
          headers:
            X-Disponibilites:
              description: Vaut inconnues si la réponse est partielle
              schema:
                type: string
                enum: [inconnues]
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Salle"
        "400":
          description: >
            capacite_min n'est pas un entier positif, ou date, debut et
            fin incomplets ou mal formés
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "429":
          $ref: "#/components/responses/TropDeRequetes"
  /salles/{id}:
    get:
      operationId: lireSalle
      summary: Lire une salle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: LYO-01
      responses:
        "200":
          description: La salle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salle"
        "404":
          description: Salle inconnue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          $ref: "#/components/responses/NonAuthentifie"
        "429":
          $ref: "#/components/responses/TropDeRequetes"
components:
  securitySchemes:
    jeton:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Jeton RS256 vérifié par la passerelle. Les appels directs, sur le
        réseau Docker Compose, ne sont pas contrôlés.
  responses:
    NonAuthentifie:
      description: >
        Jeton absent, expiré ou invalide. Réponse de la passerelle, corps
        vide, détail dans l'en-tête WWW-Authenticate.
    TropDeRequetes:
      description: >
        Limite de débit atteinte (5 requêtes par seconde, rafale de 10,
        par utilisateur et par route). Réponse de la passerelle, corps
        vide, sans en-tête Retry-After.
  schemas:
    Espace:
      type: object
      required: [id, nom, ville, quartier]
      properties:
        id:
          type: string
          example: LYO
        nom:
          type: string
          example: Lyon Part-Dieu
        ville:
          type: string
          example: Lyon
        quartier:
          type: string
          example: Part-Dieu
    Equipement:
      type: object
      required: [code, libelle]
      properties:
        code:
          type: string
          example: visio
        libelle:
          type: string
          example: Visioconférence
    Salle:
      type: object
      required:
        [id, espace_id, ville, nom, capacite, prix_horaire, equipements]
      properties:
        id:
          type: string
          example: LYO-01
        espace_id:
          type: string
          example: LYO
        ville:
          type: string
          example: Lyon
        nom:
          type: string
          example: Salle Rhône
        capacite:
          type: integer
          minimum: 1
          example: 8
        prix_horaire:
          type: number
          description: Prix d'une heure, en euros hors taxes
          example: 45
        equipements:
          type: array
          description: Codes des équipements, par ordre alphabétique
          items:
            type: string
          example: [ecran, tableau-blanc, visio]
        libre:
          type: [boolean, "null"]
          description: >
            Présent seulement quand date, debut et fin sont donnés : la
            salle est-elle libre sur ce créneau ? null si ses
            disponibilités n'ont pas pu être lues.
          example: true
    Erreur:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          example: "Salle inconnue : LYO-99"
