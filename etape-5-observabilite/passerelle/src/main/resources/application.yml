spring:
  application:
    name: passerelle
  data:
    redis:
      host: redis
      # Sans ces delais, une commande attend 60 s quand Redis ne repond
      # plus ; au-dela, la limitation de debit laisse passer la requete
      timeout: 1s
      connect-timeout: 1s
  security:
    oauth2:
      resourceserver:
        jwt:
          # cle publique RSA : la passerelle verifie, elle ne signe pas
          public-key-location: file:/cles/public.pem
  cloud:
    gateway:
      server:
        webflux:
          # Delais de la passerelle vers les services (aucun par defaut
          # pour la reponse) : au-dela, 504 Gateway Timeout. Bien sous
          # server.webflux : sous spring.cloud.gateway.httpclient (ancien
          # prefixe, encore dans un exemple de la documentation), ces
          # reglages seraient ignores sans le moindre avertissement.
          httpclient:
            connect-timeout: 2000  # en millisecondes
            response-timeout: 10s
          # Filtres appliques a toutes les routes
          default-filters:
            # Un seau de jetons par utilisateur (sujet du jeton) et par
            # route, dans Redis : 5 requetes par seconde en regime normal,
            # rafale de 10 au plus
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
          routes:
            # /api/salles/LYO-01 -> http://catalogue:3000/salles/LYO-01
            - id: catalogue
              uri: http://catalogue:3000
              predicates:
                - Path=/api/espaces/**,/api/salles/**,/api/equipements/**
              filters:
                - StripPrefix=1
            - id: disponibilites
              uri: http://disponibilites:8000
              predicates:
                - Path=/api/disponibilites/**
              filters:
                - StripPrefix=1
            - id: reservations
              uri: http://reservations:8080
              predicates:
                - Path=/api/reservations/**
              filters:
                - StripPrefix=1

logging:
  structured:
    format:
      # Une ligne JSON par evenement (Elastic Common Schema) ; les paires
      # cle-valeur (request_id...) s'y ajoutent
      console: ecs
